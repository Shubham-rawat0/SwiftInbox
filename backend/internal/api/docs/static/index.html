<!-- HTML for static distribution bundle build (swagger-ui-dist 5.33.0), customized for SwiftInbox -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftInbox Developer API</title>
    <link rel="stylesheet" type="text/css" href="./swagger-ui.css?v=3" />
    <link rel="icon" type="image/png" href="./favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="./favicon-16x16.png" sizes="16x16" />
    <style>
      html {
        box-sizing: border-box;
      }
      *, *:before, *:after {
        box-sizing: inherit;
      }
      body {
        margin: 0;
        background: #fafafa;
      }
      .swagger-ui {
        max-width: 1400px;
        margin: 0 auto;
        padding: 1rem;
      }
      @media (min-width: 768px) {
        .swagger-ui {
          padding: 1.5rem;
        }
      }
    </style>
  </head>

  <body>
    <div id="swagger-ui"></div>
    <script src="./swagger-ui-bundle.js?v=3" charset="UTF-8"> </script>
    <script src="./swagger-ui-standalone-preset.js?v=3" charset="UTF-8"> </script>
    <script src="./swagger-initializer.js?v=3" charset="UTF-8"> </script>
  </body>
</html>
