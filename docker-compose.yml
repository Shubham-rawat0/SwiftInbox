name: swiftinbox

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: temp_mail
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d temp_mail"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  migrate:
    build:
      context: ./backend
      target: migrate
    environment:
      DB_URL: postgres://postgres:postgres@postgres:5432/temp_mail?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      target: runtime
    ports:
      - "8080:8080"
      - "2525:2525"
    volumes:
      - ./backend/.env:/app/.env:ro
    environment:
      DB_URL: postgres://postgres:postgres@postgres:5432/temp_mail?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8080}
        NEXT_PUBLIC_MAIL_DOMAIN: ${NEXT_PUBLIC_MAIL_DOMAIN:-temp.mail.at}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata: